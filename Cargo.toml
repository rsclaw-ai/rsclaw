[package]
name = "rsclaw"
version = "2026.8.6"
edition = "2024"
rust-version = "1.91"
description = "AI Agent Engine Compatible with OpenClaw"
repository = "https://github.com/rsclaw-ai/rsclaw"
license = "MIT OR Apache-2.0"

[workspace]
members = ["crates/*"]

[[bin]]
name = "rsclaw"
path = "src/main.rs"

[dependencies]
# Composition root + RPC handlers (a2a, cmd, cron, gateway, hooks, server, ws)
# plus the process entry point `rsclaw_runtime::run`.
rsclaw-runtime = { path = "crates/rsclaw-runtime", version = "2026.8.6" }

# Extracted workspace crates (crate-split, feat/crate-split)
rsclaw-agent = { path = "crates/rsclaw-agent", version = "0.1.1" }
rsclaw-types = { path = "crates/rsclaw-types", version = "0.1.0" }
rsclaw-a2a-types = { path = "crates/rsclaw-a2a-types", version = "0.1.0" }
rsclaw-config = { path = "crates/rsclaw-config", version = "0.1.1" }
rsclaw-artifact = { path = "crates/rsclaw-artifact", version = "0.1.0" }
rsclaw-mcp = { path = "crates/rsclaw-mcp", version = "0.1.0" }
rsclaw-cap = { path = "crates/rsclaw-cap", version = "0.1.0" }
rsclaw-heartbeat = { path = "crates/rsclaw-heartbeat", version = "0.1.0" }
rsclaw-cli = { path = "crates/rsclaw-cli", version = "0.1.1" }
rsclaw-migrate = { path = "crates/rsclaw-migrate", version = "0.1.0" }
rsclaw-desktop = { path = "crates/rsclaw-desktop", version = "0.1.0" }
rsclaw-evolution = { path = "crates/rsclaw-evolution", version = "0.1.0" }
rsclaw-memory = { path = "crates/rsclaw-memory", version = "0.1.0" }
rsclaw-doc = { path = "crates/rsclaw-doc", version = "0.1.0" }
rsclaw-browser = { path = "crates/rsclaw-browser", version = "0.1.0" }
rsclaw-channel = { path = "crates/rsclaw-channel", version = "0.1.1" }
rsclaw-computer = { path = "crates/rsclaw-computer", version = "0.1.0" }
rsclaw-kb = { path = "crates/rsclaw-kb", version = "0.1.0" }
rsclaw-plugin = { path = "crates/rsclaw-plugin", version = "0.1.0" }
rsclaw-skill = { path = "crates/rsclaw-skill", version = "0.1.0" }
rsclaw-tools = { path = "crates/rsclaw-tools", version = "0.1.0" }
rsclaw-store = { path = "crates/rsclaw-store", version = "0.1.0" }
rsclaw-jobs = { path = "crates/rsclaw-jobs", version = "0.1.0" }
rsclaw-embed = { path = "crates/rsclaw-embed", version = "0.1.0" }
rsclaw-provider = { path = "crates/rsclaw-provider", version = "0.1.1" }
rsclaw-retry = { path = "crates/rsclaw-retry", version = "0.1.0" }
rsclaw-util = { path = "crates/rsclaw-util", version = "0.1.0" }
rsclaw-platform = { path = "crates/rsclaw-platform", version = "0.1.0" }
rsclaw-i18n = { path = "crates/rsclaw-i18n", version = "0.1.0" }
rsclaw-events = { path = "crates/rsclaw-events", version = "0.1.0" }
rsclaw-cron = { path = "crates/rsclaw-cron", version = "0.1.0" }
rsclaw-watch = { path = "crates/rsclaw-watch", version = "0.1.0" }

# Async runtime
tokio        = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util   = { version = "0.7", features = ["rt"] }
dashmap      = "6"
eventsource-stream = "0.2"

# Web framework
axum         = { version = "0.8", features = ["ws", "multipart", "macros"] }

# HTTP client
# TLS: use aws-lc-rs instead of ring for better cross-compilation (esp. Windows ARM64)
reqwest      = { version = "0.12", features = ["json", "stream", "multipart", "blocking", "rustls-tls-webpki-roots-no-provider", "socks"], default-features = false }
rustls       = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }

# Storage
redb         = "4.1"
# v2.6 kept as a one-shot fallback to upgrade existing v2 database files to
# the v3 format. redb 3+ drops support for v2; we open with `redb 4.1` first
# and only invoke this legacy crate when the open returns UpgradeRequired.
redb_legacy  = { package = "redb", version = "2.6" }
tantivy      = "0.22"

# HNSW vector index for memory search (replaced LanceDB to cut ~500 deps)
hnsw_rs    = "0.3"

# Local inference, BGE-Small embeddings (W8)
candle-core         = "0.9"
candle-nn           = "0.9"
candle-transformers = "0.9"

# Serialization
serde        = { version = "1", features = ["derive"] }
serde_json   = { version = "1", features = ["preserve_order"] }
json5        = "1"
toml         = "1"

# Error handling
anyhow    = "1"
thiserror = "2"
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive", "env"] }
dialoguer = "0.12"
ratatui = "0.28"
crossterm = "0.28"

# Utilities
uuid    = { version = "1", features = ["v4"] }
regex   = "1"

# jq interpreter for /watch --jq <expr> and built-in templates.
# `sync` feature makes jaq_json::Val use Arc instead of Rc, so the
# compiled filter can cross tokio task boundaries.
jaq-core = "3"
jaq-json = { version = "2", features = ["sync"] }
jaq-std  = "3"
chrono  = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "chrono"] }
rand          = "0.9"
which         = "7"
serde_yaml_ng = "0.10"
anycli = "0.2"
sys-info      = "0.9"
flate2        = "1"
tar           = "0.4"
md-5          = "0.10"
sha1          = "0.10"
sha2          = "0.10"
hmac          = "0.12"
hex           = "0.4"
dirs-next = "2"
console = "0.16"
tempfile  = "3"
indicatif = "0.17"
rayon     = "1"
libc = "0.2"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
bytes = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokenizers = "0.21"
qrcode = "0.14"
xz2 = "0.1"
zip = "2"
rust_xlsxwriter = "0.83"
calamine = "0.36"
docx-rs = "0.4.22"
krilla = "0.7"
pdf-extract = "0.12"
base64 = "0.22"
ed25519-dalek = "2"
aes = "0.8"
urlencoding = "2"
silk-rs = "0.2"
symphonia = { version = "0.5", features = ["mp3", "aac", "ogg", "flac", "wav", "pcm", "vorbis", "isomp4", "mkv"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
opus-decoder = "0.1"

# Computer-use stack: native input synthesis + screenshot. Replaces our
# previous shell-based path (cliclick / PowerShell / sips / screencapture)
# with cross-platform native APIs — ~100x faster and removes the fork
# overhead per action. See src/computer/operators/native.rs.
enigo = "0.6"
display-info = "0.5"
ogg = "0.9"
lark-websocket-protobuf = "0.1"
prost = "0.13"
mime = "0.3"
mime_guess = "2"
matrix-sdk = { version = "0.9", optional = true, default-features = false, features = ["e2e-encryption", "rustls-tls", "sqlite"] }
fs2 = "0.4.3"
htmd    = "0.5"
lol_html = "1.2"
# Embed `tools/` site-rules + app-rules into the binary at compile time
include_dir = "0.7"
wasmtime = { version = "36.0.13", features = ["async"] }
wasmtime-wasi = "36.0.13"
moka = { version = "0.12", features = ["future"] }

# System tray (optional)
tray-icon = { version = "0.21", optional = true }
muda = { version = "0.17", optional = true }
bzip2 = "0.6.1"
lopdf = "0.42"
glob = "0.3.3"
# ripgrep's walker — gitignore-aware, no symlink-follow by default,
# parallel-capable. Replaces `glob` for fs-tree traversal in agent
# tools so `node_modules` symlink loops and `target/` blow-ups stop
# wedging the worker thread.
ignore = "0.4"
# Glob matcher shared with `ignore`. Used by `safe_walk` to apply an
# optional basename filter (`*.rs`, `Cargo.toml`, etc.) on top of the
# walker's gitignore-aware traversal.
globset = "0.4"
encoding_rs = "0.8.35"

# Knowledge base (src/kb/)
# url:         URL canonicalization (strip trackers, sort params, lowercase host)
# arc-swap:    HNSW cache pointer swap (Week 2+); declared now since lockfile has it
# ulid:        doc_id / chunk_id / ledger_id generation; promoted from transitive
# once_cell:   chunker regex lazy init; promoted from transitive
# jieba-rs:    CJK tokenization for FTS / chunker (Week 2 use); declared now to lock version
url        = "2"
arc-swap   = "1.7"
ulid       = "1"
once_cell  = "1"
jieba-rs   = "0.7"
mailparse = "0.16.1"

# cap-rs — CLI Agent Protocol drivers. Pinned to the published
# 0.1.0 release on crates.io. For local iteration, swap to:
#   cap-rs = { path = "../cap-protocol/crates/cap-rs", ...features }
cap-rs = { version = "0.1.0", default-features = false, features = ["stream-json", "codex", "acp"] }

[features]
default = ["openclaw-migrate"]
channel-matrix = ["rsclaw-runtime/channel-matrix"]
openclaw-migrate = ["rsclaw-migrate/openclaw-migrate", "rsclaw-runtime/openclaw-migrate"]
tray = ["rsclaw-runtime/tray"]

[profile.release]
# Size-optimized (`"s"` is a good balance: much smaller than default 3 with
# minimal runtime cost. `"z"` goes further but slows CJK-heavy text / regex
# hotpaths). The gateway is long-lived so startup is not a concern.
opt-level = "s"
lto = "fat"
strip = "symbols"
codegen-units = 1
# Drop unwind tables — we don't rely on panic=unwind in release.
panic = "abort"
# Overflow/debug assertions off for smaller asserts
debug-assertions = false
overflow-checks = false

[profile.dev]
opt-level = 0
incremental = true
# Trim DWARF: keep file:line for backtraces, drop variable/type info.
# Cuts target/debug size ~40-60% without affecting panic location info.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 0

# Developer-local release — parallel codegen, thin LTO. Builds much faster
# than `release` at a small runtime cost. Use for local dogfooding.
# Run: cargo build --profile release-dev
[profile.release-dev]
inherits = "release"
# Dev-iteration profile: optimized enough to catch release-only issues, but NO
# LTO. ThinLTO runs at link time over the WHOLE binary on every build — even a
# one-crate change re-ran it, dominating "incremental" builds (~12min link).
# Dropping it (dev doesn't need LTO) + more codegen units cuts that to a couple
# minutes. Functionally identical; the publish `release` profile keeps fat LTO.
opt-level = 2
lto = false
codegen-units = 256
strip = "symbols"

# CI builds — catches release-only issues without paying for fat LTO.
# Use: cargo build --profile ci
[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16

[dev-dependencies]
tokio-test = "0.4"
tempfile   = "3"
wiremock = "0.6"
ctor = "0.4"

# Screen capture is now in-tree (rsclaw-platform::capture, script-based) —
# xcap removed entirely (it pulled pipewire → libspa → GLIBC 2.38 on Linux and
# was slow on macOS via ScreenCaptureKit cold-start).

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["handleapi", "processthreadsapi", "winnt"] }

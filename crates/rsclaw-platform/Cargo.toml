[package]
name = "rsclaw-platform"
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
libc = "0.2"
sys-info = "0.9"
which = "7"
dirs-next = "2"
rsclaw-config = { path = "../rsclaw-config" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

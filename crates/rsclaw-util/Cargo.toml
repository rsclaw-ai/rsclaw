[package]
name = "rsclaw-util"
version = "0.1.0"
description = "Util crate for RsClaw — internal workspace crate, not for direct use"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
serde_json = { version = "1", features = ["preserve_order"] }
dirs-next = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

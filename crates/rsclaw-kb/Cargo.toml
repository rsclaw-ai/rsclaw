[package]
name = "rsclaw-kb"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
rsclaw-types = { path = "../rsclaw-types" }
rsclaw-config = { path = "../rsclaw-config" }
rsclaw-util = { path = "../rsclaw-util" }
rsclaw-i18n = { path = "../rsclaw-i18n" }
rsclaw-events = { path = "../rsclaw-events" }
rsclaw-platform = { path = "../rsclaw-platform" }
rsclaw-provider = { path = "../rsclaw-provider" }
rsclaw-store = { path = "../rsclaw-store" }
rsclaw-embed = { path = "../rsclaw-embed" }
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "blocking", "rustls-tls-webpki-roots-no-provider", "socks"], default-features = false }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
tantivy = "0.22"
hnsw_rs = "0.3"
ulid = "1"
once_cell = "1"
jieba-rs = "0.7"
redb = "4.1"
serde_yaml_ng = "0.10"
async-trait = "0.1"
thiserror = "2"
regex = "1"
sha2 = "0.10"
base64 = "0.22"
tempfile = "3"
dirs-next = "2"
# Canonicalizers: spreadsheets / OOXML / PDF / HTML / email
calamine = "0.26"
zip = "2"
pdf-extract = "0.10"
lol_html = "1.2"
mailparse = "0.16.1"

[dev-dependencies]
rust_xlsxwriter = "0.83"

[package]
name = "rsclaw-channel"
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
async-trait = "0.1"
futures = "0.3"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
regex = "1"
url = "2"
urlencoding = "2"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hex = "0.4"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
qrcode = "0.14"
zip = "2"
flate2 = "1"
dirs-next = "2"
which = "7"
mime = "0.3"
mime_guess = "2"
encoding_rs = "0.8.35"
htmd = "0.5"
lol_html = "1.2"
mailparse = "0.16.1"
json5 = "1"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "blocking", "rustls-tls-webpki-roots-no-provider", "socks"], default-features = false }
symphonia = { version = "0.5", features = ["mp3", "aac", "ogg", "flac", "wav", "pcm", "vorbis", "isomp4", "mkv"] }
silk-rs = "0.2"
opus-decoder = "0.1"
ogg = "0.9"
lark-websocket-protobuf = "0.1"
prost = "0.13"
tempfile = "3"
matrix-sdk = { version = "0.9", optional = true, default-features = false, features = ["e2e-encryption", "rustls-tls", "sqlite"] }
rsclaw-types = { path = "../rsclaw-types" }
rsclaw-config = { path = "../rsclaw-config" }
rsclaw-provider = { path = "../rsclaw-provider" }
rsclaw-store = { path = "../rsclaw-store" }
rsclaw-util = { path = "../rsclaw-util" }
rsclaw-i18n = { path = "../rsclaw-i18n" }
rsclaw-events = { path = "../rsclaw-events" }
rsclaw-platform = { path = "../rsclaw-platform" }
rsclaw-retry = { path = "../rsclaw-retry" }
rsclaw-doc = { path = "../rsclaw-doc" }
rsclaw-embed = { path = "../rsclaw-embed" }

[features]
channel-matrix = ["dep:matrix-sdk"]

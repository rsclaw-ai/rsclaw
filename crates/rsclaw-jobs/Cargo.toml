[package]
name = "rsclaw-jobs"
version = "0.1.0"
description = "Jobs crate for RsClaw — internal workspace crate, not for direct use"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

# Pure provider-API job layer (crate-split, step-12 P2): the `submit_*` /
# `poll_*` / `download_artifact` adapters lifted out of
# `gateway/external_jobs_worker.rs`. Breaks the agent->gateway edge: the
# video tool now calls `rsclaw_jobs::submit_*` instead of reaching into the
# gateway worker. The gateway-coupled `ExternalJobsWorker` tick/delivery
# loop stays in root and calls back into this crate.

[dependencies]
anyhow = "1"
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "blocking", "rustls-tls-webpki-roots-no-provider", "socks"], default-features = false }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
rand = "0.9"
dirs-next = "2"
tokio = { version = "1", features = ["full"] }

rsclaw-types = { path = "../rsclaw-types", version = "0.1.0" }
rsclaw-provider = { path = "../rsclaw-provider", version = "0.1.0" }
rsclaw-config = { path = "../rsclaw-config", version = "0.1.0" }
rsclaw-channel = { path = "../rsclaw-channel", version = "0.1.0" }

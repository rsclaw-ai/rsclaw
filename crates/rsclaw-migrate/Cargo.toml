[package]
name = "rsclaw-migrate"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
redb = "4.1"
rayon = "1"
sha2 = "0.10"
regex = "1"
hex = "0.4"
json5 = "1"
dirs-next = "2"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", optional = true, features = ["bundled"] }
rsclaw-config = { path = "../rsclaw-config" }
rsclaw-memory = { path = "../rsclaw-memory" }
rsclaw-store = { path = "../rsclaw-store" }

[features]
openclaw-migrate = ["rusqlite"]

[package]
name = "rsclaw-computer"
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
rsclaw-types = { path = "../rsclaw-types" }
rsclaw-config = { path = "../rsclaw-config" }
rsclaw-util = { path = "../rsclaw-util" }
rsclaw-i18n = { path = "../rsclaw-i18n" }
rsclaw-events = { path = "../rsclaw-events" }
rsclaw-platform = { path = "../rsclaw-platform" }
rsclaw-provider = { path = "../rsclaw-provider" }
rsclaw-store = { path = "../rsclaw-store" }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
enigo = "0.6"
display-info = "0.5"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
# Screen capture + window enumeration via rsclaw-platform::capture (script-based,
# replaces xcap — works on Linux too).

[dev-dependencies]
tempfile = "3"

[package]
name = "rsclaw-computer"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
rsclaw-types = { path = "../rsclaw-types" }
rsclaw-config = { path = "../rsclaw-config" }
rsclaw-util = { path = "../rsclaw-util" }
rsclaw-i18n = { path = "../rsclaw-i18n" }
rsclaw-events = { path = "../rsclaw-events" }
rsclaw-platform = { path = "../rsclaw-platform" }
rsclaw-provider = { path = "../rsclaw-provider" }
rsclaw-store = { path = "../rsclaw-store" }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
enigo = "0.6"
display-info = "0.5"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"

# xcap pulled in pipewire → libspa → GLIBC symbol chain on Linux; native.rs
# gates the `use xcap::Monitor` behind cfg(not(target_os = "linux")) and falls
# back to a stub-error on Linux. Match the root crate's target-gated dep.
[target.'cfg(not(target_os = "linux"))'.dependencies]
xcap = "0.9"

[dev-dependencies]
tempfile = "3"

[package]
name = "rsclaw-retry"
version = "0.1.0"
description = "Retry crate for RsClaw — internal workspace crate, not for direct use"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
tracing = "0.1"
rand = "0.9"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "blocking", "rustls-tls-webpki-roots-no-provider", "socks"], default-features = false }

[package]
name = "rsclaw-desktop"
version = "0.1.0"
description = "Desktop crate for RsClaw — internal workspace crate, not for direct use"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
base64 = "0.22"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
serde_json = { version = "1", features = ["preserve_order"] }
async-trait = "0.1"
enigo = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# Screen capture + window enumeration: in-tree, script-based (screencapture /
# PowerShell / grim·scrot·import). Replaces xcap — far faster on macOS and works
# on Linux too (xcap was disabled there for the pipewire/libspa build chain).
rsclaw-platform = { path = "../rsclaw-platform", version = "0.1.0" }

# macOS: post raw CGScrollWheelEvents. enigo's decorated scroll event is ignored
# by WeChat 4.x's CEF/radium view (verified: screenshot hash unchanged), while a
# raw CGEvent scroll moves it. Same core-graphics version enigo already pulls in.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["highsierra"] }

[package]
name = "rsclaw-cap"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
rsclaw-types = { path = "../rsclaw-types" }
rsclaw-events = { path = "../rsclaw-events" }
rsclaw-config = { path = "../rsclaw-config" }
rsclaw-memory = { path = "../rsclaw-memory" }
rsclaw-i18n = { path = "../rsclaw-i18n" }
cap-rs = { version = "0.1.1", default-features = false, features = ["stream-json", "codex", "acp"] }

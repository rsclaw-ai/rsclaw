[package]
name = "rsclaw-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
rsclaw-types = { path = "../rsclaw-types" }
rsclaw-config = { path = "../rsclaw-config" }
rsclaw-util = { path = "../rsclaw-util" }
rsclaw-i18n = { path = "../rsclaw-i18n" }
rsclaw-events = { path = "../rsclaw-events" }
rsclaw-platform = { path = "../rsclaw-platform" }
rsclaw-provider = { path = "../rsclaw-provider" }
rsclaw-store = { path = "../rsclaw-store" }
rsclaw-channel = { path = "../rsclaw-channel" }
rsclaw-kb = { path = "../rsclaw-kb" }
rsclaw-browser = { path = "../rsclaw-browser" }
rsclaw-memory = { path = "../rsclaw-memory" }
rsclaw-desktop = { path = "../rsclaw-desktop" }
json5 = "1"
base64 = "0.22"
ed25519-dalek = "2"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "blocking", "rustls-tls-webpki-roots-no-provider", "socks"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
dirs-next = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
wasmtime = { version = "36.0.10", features = ["async"] }
wasmtime-wasi = "36.0.10"
chrono = { version = "0.4", features = ["serde"] }
which = "7"
rand = "0.9"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

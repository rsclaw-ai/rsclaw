[package]
name = "rsclaw-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
rsclaw-types = { path = "../rsclaw-types" }
rsclaw-config = { path = "../rsclaw-config" }
rsclaw-util = { path = "../rsclaw-util" }
rsclaw-i18n = { path = "../rsclaw-i18n" }
rsclaw-events = { path = "../rsclaw-events" }
rsclaw-platform = { path = "../rsclaw-platform" }
rsclaw-provider = { path = "../rsclaw-provider" }
rsclaw-store = { path = "../rsclaw-store" }
rsclaw-channel = { path = "../rsclaw-channel" }
rsclaw-kb = { path = "../rsclaw-kb" }
rsclaw-browser = { path = "../rsclaw-browser" }
wasmtime = { version = "36.0.10", features = ["async"] }
wasmtime-wasi = "36.0.10"

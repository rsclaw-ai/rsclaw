[package]
name = "rsclaw-types"
version = "0.1.0"
publish = false
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
md-5 = "0.10"
hex = "0.4"
futures = "0.3"
anyhow = "1"

[package]
name = "rsclaw-mcp"
version = "0.1.0"
description = "Mcp crate for RsClaw — internal workspace crate, not for direct use"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
rsclaw-config = { path = "../rsclaw-config", version = "0.1.0" }
rsclaw-provider = { path = "../rsclaw-provider", version = "0.1.0" }
rsclaw-util = { path = "../rsclaw-util", version = "0.1.0" }

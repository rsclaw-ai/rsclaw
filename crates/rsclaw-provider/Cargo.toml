[package]
name = "rsclaw-provider"
version = "0.1.0"
description = "Provider crate for RsClaw — internal workspace crate, not for direct use"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
base64 = "0.22"
url = "2"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
toml = "1"
bytes = "1"
async-trait = "0.1"
eventsource-stream = "0.2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync", "time"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "blocking", "rustls-tls-webpki-roots-no-provider", "socks"], default-features = false }
rsclaw-types = { path = "../rsclaw-types", version = "0.1.0" }
rsclaw-config = { path = "../rsclaw-config", version = "0.1.0" }
rsclaw-util = { path = "../rsclaw-util", version = "0.1.0" }
rsclaw-i18n = { path = "../rsclaw-i18n", version = "0.1.0" }
rsclaw-embed = { path = "../rsclaw-embed", version = "0.1.0" }

[dev-dependencies]
wiremock = "0.6"
# Test-only: install the rustls aws-lc-rs crypto provider once before any
# test builds a reqwest client (reqwest uses `*-no-provider`, so the app
# normally installs it at startup — tests have no startup). Mirrors
# rsclaw-runtime's `init_test_crypto` ctor.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
ctor = "0.4"

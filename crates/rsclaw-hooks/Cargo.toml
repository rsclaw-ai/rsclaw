[package]
name = "rsclaw-hooks"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
rsclaw-types = { path = "../rsclaw-types" }
rsclaw-config = { path = "../rsclaw-config" }
rsclaw-util = { path = "../rsclaw-util" }
rsclaw-i18n = { path = "../rsclaw-i18n" }
rsclaw-events = { path = "../rsclaw-events" }
rsclaw-platform = { path = "../rsclaw-platform" }
rsclaw-provider = { path = "../rsclaw-provider" }

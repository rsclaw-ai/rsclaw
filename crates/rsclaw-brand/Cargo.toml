[package]
name = "rsclaw-brand"
version = "0.1.0"
description = "Compile-time brand identity for RsClaw — internal workspace crate, not for direct use"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
build = "build.rs"
include = ["src/**", "brand/**", "build.rs", "Cargo.toml"]

[dependencies]
sha2 = "0.10"

[build-dependencies]
sha2 = "0.10"
toml = "1"
json5 = "1"
serde_json = "1"

[dev-dependencies]
toml = "1"

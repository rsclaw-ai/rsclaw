# Default brand. Every field is required; see docs/branding.md.
id = "rsclaw"

# Names shown to people.
product_name = "RsClaw"
product_name_zh = "螃蟹AI"
# One-line description: `--help` header and the A2A agent card.
tagline = "AI Agent Engine Compatible with OpenClaw"
assistant_name = "Crab AI Assistant"
assistant_name_zh = "螃蟹AI助手"
emoji = "🦀"
website = "rsclaw.ai"

# Names the operating system and the file system see.
cli_name = "rsclaw"
home_dir = ".rsclaw"
config_file = "rsclaw.json5"
service_label = "ai.rsclaw.gateway"
service_unit = "rsclaw-gateway"
windows_service = "rsclaw"
service_display = "RsClaw AI Gateway"
user_agent = "rsclaw"
# Gateway default port. `--dev` uses +1 and named profiles +2..=+255, so
# brands that may share a machine need ports at least 256 apart.
default_port = 18888

# GitHub `owner/repo` used as the release fallback for `update`; "" disables it.
release_repo = "rsclaw-ai/rsclaw"

[urls]
# Managed model / media API (no trailing slash, no /v1).
api = "https://api.rsclaw.ai"
# Skill, plugin and tool hub.
hub = "https://hub.rsclaw.ai"
# Release metadata and the shipped defaults catalog.
app = "https://app.rsclaw.ai"

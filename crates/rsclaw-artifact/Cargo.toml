[package]
name = "rsclaw-artifact"
version = "0.1.0"
description = "Artifact crate for RsClaw — internal workspace crate, not for direct use"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
rsclaw-config = { path = "../rsclaw-config", version = "0.1.0" }

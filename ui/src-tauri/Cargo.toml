[package]
name = "rsclaw-ui"
version = "2026.6.16"
description = "AI Agent Engine Compatible with OpenClaw"
authors = ["RsClaw Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rsclaw-ai/rsclaw"
default-run = "rsclaw-ui"
edition = "2024"
rust-version = "1.91"

# Silence the noisy `unexpected cfg condition value: cargo-clippy` warnings
# that bubble up from `objc 0.2.x`'s `msg_send!` macro expansion. The macro
# lives in a third-party crate and isn't fixable here; declaring the cfg
# value as known is the recommended workaround per rustc's diagnostic.
# Root this crate as its own workspace. The repo root Cargo.toml declares a
# `[workspace]` (members = crates/*) for the CLI crate-split; without this empty
# table cargo treats `ui/src-tauri` as an accidental workspace member and
# `cargo metadata` (run by `tauri build`) errors. The desktop app builds
# standalone via the bundled CLI sidecar, so it has no path deps into the root.
[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "macos-private-api", "webview-data-url"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
time = { version = "0.3", features = ["serde-well-known"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
json5 = "0.4"
toml = "1"
percent-encoding = "2.3.1"
url = "2.5"
reqwest = { version = "0.11.18", features = ["json", "stream"] }
futures-util = "0.3.30"
bytes = "1.7.2"
auto-launch = "0.5"
dirs = "5"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]

[profile.release]
# The Tauri UI binary is mostly webview glue — aggressive size optimization
# `"z"` is fine here. Keeps the installer small and Windows AV scans fast.
opt-level = "z"
lto = "fat"
strip = "symbols"
codegen-units = 1
panic = "abort"
debug-assertions = false
overflow-checks = false
